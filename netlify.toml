[build]
  command = "pnpm build"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  # Let esbuild bundle node_modules to avoid runtime resolution problems with ESM/CJS
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
